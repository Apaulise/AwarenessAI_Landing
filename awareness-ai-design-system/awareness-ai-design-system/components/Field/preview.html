<!-- @dsCard group="Formularios" height=210 subtitle="Input, select y textarea con label, hint y error" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>preview</title></head>
<body>
<div class="aw-pad" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div class="aw-field"><label class="aw-label">Qué buscar</label><input class="aw-input" placeholder="Peluquerías, clínicas estéticas…"><span class="aw-hint">Término que se busca en Google Maps.</span></div>
<div class="aw-field"><label class="aw-label">Zona</label><input class="aw-input" value="Palermo, CABA"></div>
<div class="aw-field"><label class="aw-label">Categoría</label><select class="aw-input"><option>Salud y belleza</option><option>Sin asignar</option></select><span class="aw-hint">Se asigna a todos los leads de esta lista.</span></div>
<div class="aw-field"><label class="aw-label">Cantidad máxima</label><input class="aw-input aw-input--error aw-mono" value="500"><span class="aw-hint aw-hint--error">Máximo 200 por búsqueda.</span></div>
</div>
</body>
</html>
