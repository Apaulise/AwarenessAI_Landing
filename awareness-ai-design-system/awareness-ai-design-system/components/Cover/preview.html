<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Awareness AI</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .sig { fill:var(--signal); }
  .s2 { fill:var(--smoke-2); }
  .s3 { fill:var(--smoke-3); }
  .s5 { fill:var(--smoke-5); }
  .blk { rx:var(--radius-lg); }
  .wave { fill:none; stroke:var(--smoke-4); stroke-width:2; stroke-linecap:round; }
  .wave.hot { stroke:var(--signal); }
  .node { fill:var(--smoke-4); }
  .node.hot { fill:var(--signal); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.95; font-weight:600; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      signal 128×232 bled off the top (the one identity hue, largest) · smoke-3 128×160 · smoke-2 176×208 bleeding off the right · smoke-5 64×32 relief tint — ≈36% of 960×288
  arrangement one tall signal slab with smoke satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     literal motif from the logo (smoke waves ending in nodes): two stroked waves on the ground and over the smoke, nodes as radius-full discs, one wave and node in signal
  scales      sides in space-4 multiples; gutters space-4; bottom inset space-6; corners radius-lg; nodes radius-full
-->
<rect class="sig blk" x="32" y="-24" width="128" height="232" rx="8"/>
<rect class="s3 blk" x="176" y="96" width="128" height="160" rx="8"/>
<rect class="s2 blk" x="320" y="48" width="176" height="208" rx="8"/>
<rect class="s5 blk" x="96" y="224" width="64" height="32" rx="8"/>
<path class="wave" d="M8 264 C 40 200, 120 250, 176 176"/>
<circle class="node" cx="8" cy="264" r="6"/>
<path class="wave hot" d="M248 64 C 280 40, 300 96, 352 24"/>
<circle class="node hot" cx="248" cy="64" r="8"/>
<path class="wave" d="M384 144 C 410 120, 430 180, 460 150"/>
<circle class="node" cx="384" cy="144" r="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Awareness<br>AI</h1>
<p class="tag">Señal y humo: herramientas de IA que se usan como instrumentos.</p>
</div>
</div>
</body>
</html>
